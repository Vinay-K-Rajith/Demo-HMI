<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);padding:0;font-family:var(--font-ui);display:flex}
  .pane{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;padding:30px}
  .pane.dark{background:var(--obsidian-900)}
  .pane.light{background:#eaf1f7}
  img{height:54px}
  .word{font-family:var(--font-display);font-weight:600;font-size:40px;letter-spacing:.06em}
</style>
</head>
<body>
  <div class="pane dark">
    <img src="../assets/volta-logomark.svg" alt="Volta">
    <span class="word" style="color:#eaf1f7">VOLTA</span>
  </div>
  <div class="pane light">
    <img src="../assets/volta-logomark.svg" alt="Volta">
    <span class="word" style="color:#04060a">VOLTA</span>
  </div>
</body>
</html>
