<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);color:var(--fg-2);padding:26px 30px;font-family:var(--font-mono);font-size:14px}
  .line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-1)}
  .line:last-child{border:0}
  .k{color:var(--fg-3)}
  .v{color:var(--fg-1)}
  .v.c{color:var(--cyan)} .v.g{color:var(--green)} .v.a{color:var(--amber)}
</style>
</head>
<body>
  <div class="line"><span class="k">PWR_OUT</span><span class="v c">142.6 kW</span></div>
  <div class="line"><span class="k">REGEN</span><span class="v g">+18.2 kW</span></div>
  <div class="line"><span class="k">MOTOR_T</span><span class="v a">61.4 °C</span></div>
  <div class="line"><span class="k">VIN</span><span class="v">VLT·5XK2·09Q</span></div>
</body>
</html>
