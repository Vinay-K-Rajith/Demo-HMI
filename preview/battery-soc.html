<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);padding:26px 30px;font-family:var(--font-ui);display:flex;flex-direction:column;gap:18px}
  .batt{display:flex;align-items:center;gap:16px}
  .shell{position:relative;width:230px;height:40px;border:2px solid var(--line-3);border-radius:8px;padding:4px;display:flex;align-items:center}
  .shell::after{content:"";position:absolute;right:-7px;top:11px;width:5px;height:14px;background:var(--line-3);border-radius:0 3px 3px 0}
  .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 14px var(--cyan-glow)}
  .pct{font-family:var(--font-display);font-weight:600;font-size:30px;color:var(--fg-1);font-variant-numeric:tabular-nums}
  .sub{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
  .chg{color:var(--green);display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
  <div class="batt">
    <div class="shell"><div class="fill" style="width:72%"></div></div>
    <div><div class="pct">72%</div></div>
  </div>
  <div class="sub chg"><i data-lucide="battery-charging" style="width:16px;height:16px"></i> Charging · 41 min to 80% · +1.8 kWh regen</div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
