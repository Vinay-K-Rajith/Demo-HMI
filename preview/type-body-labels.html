<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);color:var(--fg-1);padding:26px 30px;font-family:var(--font-ui)}
  .stack > * { margin:0 0 12px; }
  .tag{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);margin-left:12px;letter-spacing:.04em}
  p{max-width:560px}
</style>
</head>
<body>
  <div class="stack">
    <div class="eyebrow">SENSOR FUSION · ACTIVE<span class="tag">EYEBROW · JetBrains Mono · 12 · cyan</span></div>
    <div class="label">REMAINING RANGE<span class="tag">LABEL · Sora 600 · 14 · tracked uppercase</span></div>
    <p>Regenerative braking recovered 1.8 kWh on the last descent, extending estimated range.<span class="tag">BODY · Sora 400 · 17</span></p>
    <div class="caption">Updated 2 seconds ago · GPS lock 11 sats<span class="tag">CAPTION · Sora 400 · 12 · fg-3</span></div>
  </div>
</body>
</html>
