<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);padding:30px;font-family:var(--font-mono)}
  .row{display:flex;gap:24px}
  .item{flex:1;text-align:center}
  .box{height:70px;border-radius:var(--r-md);background:var(--obsidian-600);border:1px solid var(--line-2)}
  .n{font-size:10px;color:var(--fg-2);margin-top:12px}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="n">shadow-1 · controls</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="n">shadow-2 · cards</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="n">shadow-3 · overlays</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--glow-cyan);border-color:var(--cyan-dim)"></div><div class="n">glow · active</div></div>
  </div>
</body>
</html>
