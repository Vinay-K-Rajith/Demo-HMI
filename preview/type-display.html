<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);color:var(--fg-1);padding:26px 30px;font-family:var(--font-ui)}
  .row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .unit{font-family:var(--font-mono);font-size:22px;color:var(--fg-3);font-weight:500}
  .meta{margin-top:14px;display:flex;gap:24px}
  .meta span{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:.04em}
</style>
</head>
<body>
  <div class="row">
    <div class="t-mega" style="color:var(--cyan)">128</div>
    <div class="unit">km/h</div>
    <div class="t-display" style="margin-left:8px">384<span class="unit"> km</span></div>
  </div>
  <div class="meta">
    <span>SPACE GROTESK · 600</span>
    <span>MEGA 96 / DISPLAY 64</span>
    <span>tabular-nums · tracking −0.03em</span>
  </div>
</body>
</html>
