<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);padding:26px 30px;font-family:var(--font-mono)}
  .item{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .bar{height:14px;background:var(--cyan);border-radius:3px;opacity:.85}
  .n{font-size:10.5px;color:var(--fg-2);width:96px}
</style>
</head>
<body>
  <div class="item"><span class="n">s-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="item"><span class="n">s-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="item"><span class="n">s-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="item"><span class="n">s-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="item"><span class="n">s-5 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="item"><span class="n">s-6 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="item"><span class="n">s-7 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="item"><span class="n">s-8 · 64</span><div class="bar" style="width:64px"></div></div>
</body>
</html>
