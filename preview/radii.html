<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);padding:24px 30px;font-family:var(--font-mono)}
  .row{display:flex;gap:16px;align-items:flex-end}
  .item{text-align:center}
  .box{background:var(--obsidian-500);border:1px solid var(--line-3);width:74px;height:60px}
  .n{font-size:10px;color:var(--fg-2);margin-top:8px}
  .px{font-size:9px;color:var(--fg-3)}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--r-xs)"></div><div class="n">xs</div><div class="px">6px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-sm)"></div><div class="n">sm</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-md)"></div><div class="n">md</div><div class="px">16px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-lg)"></div><div class="n">lg</div><div class="px">22px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-xl)"></div><div class="n">xl</div><div class="px">30px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-pill);width:60px;height:60px"></div><div class="n">pill</div><div class="px">999</div></div>
  </div>
</body>
</html>
