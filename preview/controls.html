<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);padding:24px 30px;font-family:var(--font-ui);display:flex;gap:30px;align-items:center;flex-wrap:wrap}
  /* segmented */
  .seg{display:flex;background:var(--obsidian-700);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:4px}
  .seg button{font-family:var(--font-ui);font-weight:600;font-size:13px;border:0;background:transparent;color:var(--fg-2);padding:9px 18px;border-radius:var(--r-pill);cursor:pointer}
  .seg button.on{background:var(--cyan);color:#04060a;box-shadow:var(--glow-cyan)}
  /* toggle */
  .tog{width:56px;height:30px;border-radius:var(--r-pill);background:var(--blue);position:relative;box-shadow:var(--glow-blue)}
  .tog::after{content:"";position:absolute;top:3px;left:29px;width:24px;height:24px;border-radius:50%;background:#eaf1f7}
  .togoff{background:var(--obsidian-400);box-shadow:none}
  .togoff::after{left:3px}
  .grp{display:flex;align-items:center;gap:12px}
  .gl{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
</style>
</head>
<body>
  <div class="seg">
    <button>Eco</button>
    <button class="on">Comfort</button>
    <button>Sport</button>
  </div>
  <div class="grp"><div class="tog"></div><span class="gl">Autopilot</span></div>
  <div class="grp"><div class="tog togoff"></div><span class="gl">Lane assist</span></div>
</body>
</html>
