<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--obsidian-800);padding:24px 30px;font-family:var(--font-mono)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sw{height:78px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
  .n{font-size:10px;color:var(--fg-1);font-weight:600}
  .hex{font-size:9px;color:var(--fg-3)}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw" style="background:var(--obsidian-900)"><span class="n">900</span><span class="hex">#04060a</span></div>
    <div class="sw" style="background:var(--obsidian-800)"><span class="n">800</span><span class="hex">#080b11</span></div>
    <div class="sw" style="background:var(--obsidian-700)"><span class="n">700</span><span class="hex">#0d1219</span></div>
    <div class="sw" style="background:var(--obsidian-600)"><span class="n">600</span><span class="hex">#131a24</span></div>
    <div class="sw" style="background:var(--obsidian-500)"><span class="n">500</span><span class="hex">#1a2230</span></div>
    <div class="sw" style="background:var(--obsidian-400)"><span class="n">400</span><span class="hex">#232d3d</span></div>
  </div>
</body>
</html>
